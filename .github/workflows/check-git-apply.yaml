name: Check Chromium patch stack

on:
  pull_request:
    branches:
      - release
    paths:
      - "build/**"
      - "tools/lumen/**"
      - ".github/workflows/check-git-apply.yaml"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit from this repository"
        required: true
        default: "release"

permissions:
  contents: read

concurrency:
  group: patch-stack-${{ github.event.pull_request.number || inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  validate-patches:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Lumen source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.ref || github.sha }}
          path: cromite
          fetch-depth: 1

      - name: Validate downstream configuration
        run: bash cromite/tools/lumen/validate.sh

      - name: Install patch tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dos2unix patchutils wget wiggle
          wget -q https://github.com/uazo/superpatch/releases/latest/download/SuperPatchUtils.tar.gz
          tar xfz SuperPatchUtils.tar.gz

      - name: Resolve pinned Chromium and upstream revisions
        run: |
          VERSION=$(tr -d '[:space:]' < cromite/build/RELEASE)
          UPSTREAM_COMMIT=$(tr -d '[:space:]' < cromite/build/UPSTREAM_COMMIT)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "UPSTREAM_COMMIT=$UPSTREAM_COMMIT" >> "$GITHUB_ENV"

      - name: Cache Chromium patch sources
        uses: actions/cache@v4
        with:
          path: chromium-src
          key: chromium-patch-source-${{ env.VERSION }}-${{ env.UPSTREAM_COMMIT }}

      - name: Download Chromium patch sources
        run: |
          export HOME="$GITHUB_WORKSPACE"
          ./bin/SuperPatchUtils bromite "$UPSTREAM_COMMIT" "$HOME/chromium-src"
          mkdir -p "$HOME/chromium/src"
          cp -rT "$HOME/chromium-src" "$HOME/chromium/src"
          cd "$HOME/chromium/src"
          git init
          git config user.email "actions@users.noreply.github.com"
          git config user.name "GitHub Actions"
          git add .
          git commit -m "$VERSION"
          git tag -a "$VERSION" -m "$VERSION"
          git add -f v8
          git commit -m ":NOEXPORT: v8" || true

      - name: Apply Cromite and Lumen patches
        run: |
          export HOME="$GITHUB_WORKSPACE"
          cd "$HOME/chromium/src"
          export SILENT=true
          export SKIPAUTOGENERATED=true
          bash "$HOME/cromite/tools/apply-all-patch.sh"
