name: Publish Lumen TV Browser

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Successful isolated build run containing lumen-tv-browser-arm64"
        required: true
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
      draft:
        description: "Create as a draft release"
        required: true
        type: boolean
        default: true
      prerelease:
        description: "Mark as a pre-release"
        required: true
        type: boolean
        default: true

permissions:
  actions: read
  contents: write

concurrency:
  group: lumen-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release

      - name: Validate release source
        run: bash tools/lumen/validate.sh

      - name: Download signed ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: lumen-tv-browser-arm64
          path: dist
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Verify release payload
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must use semantic versioning, for example v0.1.0" >&2
            exit 1
          fi
          mapfile -t APKS < <(find dist -type f -name '*.apk' -print)
          if [ "${#APKS[@]}" -ne 1 ]; then
            echo "Expected exactly one APK in lumen-tv-browser-arm64, found ${#APKS[@]}" >&2
            exit 1
          fi
          mv "${APKS[0]}" dist/LumenTVBrowser-arm64.apk
          sha256sum dist/LumenTVBrowser-arm64.apk > dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        run: |
          OPTIONS=(--target release --title "Lumen TV Browser $RELEASE_TAG" --generate-notes)
          if [ "${{ inputs.draft }}" = "true" ]; then OPTIONS+=(--draft); fi
          if [ "${{ inputs.prerelease }}" = "true" ]; then OPTIONS+=(--prerelease); fi
          gh release create "$RELEASE_TAG" \
            dist/LumenTVBrowser-arm64.apk \
            dist/SHA256SUMS.txt \
            "${OPTIONS[@]}"
